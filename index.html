<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pístov — parcely a rodinné domy u Jihlavy</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="studio/">
  <script>
    // The site lives in /studio/. Old links with a configuration (?parcela=…) go to the offer page.
    (function () {
      var q = location.search, keys = ["parcela", "dum", "dispozice", "material", "rezim", "pohled", "detail", "stav", "stanoviste"];
      var cfg = keys.some(function (k) { return new URLSearchParams(q).has(k); });
      var h = location.hash, target = cfg || h === "#explorer" ? "studio/nabidka.html" + q : h === "#domy" ? "studio/domy.html" : "studio/" + h;
      location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=studio/">
</head>
<body><p><a href="studio/">Pokračovat na web Pístov</a></p></body>
</html>
